<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CashFlow | Statistics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page="statistics">
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <main class="layout">
    <header id="shellHeader"></header>

    <section class="panel">
      <h1>Statistics</h1>
      <p id="statsPeriod" class="subtle"></p>
      <section class="cards" id="summaryCards"></section>
    </section>

    <section class="panel">
      <h2>Category Pie Chart</h2>
      <div class="pie-wrap">
        <div id="categoryPie" class="pie-chart" aria-label="Category distribution chart"></div>
        <ul id="pieLegend" class="pie-legend"></ul>
      </div>

      <h3>Details</h3>
      <ul id="categoryDetails" class="stats-list"></ul>
    </section>
  </main>

  <script src="/common.js"></script>
  <script src="/statistics.js"></script>
</body>
</html>
