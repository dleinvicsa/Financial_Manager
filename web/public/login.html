<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CashFlow | Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <main class="layout auth-layout">
    <section class="panel auth-card">
      <div class="auth-brand">
        <img class="brand-logo auth-logo" src="/CashFlow2.png" alt="CashFlow logo" />
      </div>
      <h1>Welcome Back</h1>
      <p class="subtle">Sign in to your account or create a new one.</p>

      <div class="tabs">
        <button id="tabLogin" class="tab-btn tab-btn-active" type="button">Login</button>
        <button id="tabRegister" class="tab-btn" type="button">Register</button>
      </div>

      <form id="loginForm" class="grid-form">
        <label>
          Username
          <input id="loginUsername" required />
        </label>
        <label>
          Password
          <input id="loginPassword" type="password" required />
        </label>
        <button type="submit">Sign in</button>
      </form>

      <form id="registerForm" class="grid-form hidden">
        <label>
          Username
          <input id="regUsername" required />
        </label>
        <label>
          Password
          <input id="regPassword" type="password" required />
        </label>
        <button type="submit">Create account</button>
      </form>

      <p id="authMessage" class="message"></p>
    </section>
  </main>

  <script src="/common.js"></script>
  <script src="/login.js"></script>
</body>
</html>
