<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CashFlow | Categories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page="categories">
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <main class="layout">
    <header id="shellHeader"></header>

    <section class="panel">
      <h2>Create Category</h2>
      <form id="createCategoryForm" class="grid-form">
        <label>
          Name
          <input id="categoryName" required />
        </label>
        <label>
          Type
          <select id="categoryType">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </label>
        <button type="submit">Create</button>
      </form>
      <p id="categoryMessage" class="message"></p>
    </section>

    <section class="split">
      <div class="panel">
        <h2>Income Categories</h2>
        <ul id="incomeCategories" class="stats-list"></ul>
      </div>
      <div class="panel">
        <h2>Expense Categories</h2>
        <ul id="expenseCategories" class="stats-list"></ul>
      </div>
    </section>
  </main>

  <script src="/common.js"></script>
  <script src="/categories.js"></script>
</body>
</html>
