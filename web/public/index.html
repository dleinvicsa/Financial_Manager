<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CashFlow Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <main class="layout">
    <header class="hero">
      <p class="eyebrow">CashFlow</p>
      <h1>Your Money Control Center</h1>
      <p id="profileLine">Loading profile...</p>
    </header>

    <section class="cards" id="cards"></section>

    <section class="panel">
      <h2>Create Transaction</h2>
      <form id="txForm" class="grid-form">
        <label>
          Type
          <select id="txType">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </label>
        <label>
          Amount
          <input id="txAmount" type="number" min="0.01" step="0.01" required />
        </label>
        <label>
          Wallet
          <select id="txWallet" required></select>
        </label>
        <label>
          Category
          <select id="txCategory" required></select>
        </label>
        <label>
          Date
          <input id="txDate" type="date" required />
        </label>
        <label class="wide">
          Description
          <input id="txDescription" type="text" maxlength="120" placeholder="Optional note" />
        </label>
        <button type="submit">Save transaction</button>
      </form>
      <p id="txMessage" class="message"></p>
    </section>

    <section class="split">
      <div class="panel">
        <h2>Add Wallet</h2>
        <form id="walletForm" class="grid-form">
          <label>
            Name
            <input id="walletName" required />
          </label>
          <label>
            Initial balance
            <input id="walletBalance" type="number" min="0" step="0.01" value="0" required />
          </label>
          <button type="submit">Create wallet</button>
        </form>
        <p id="walletMessage" class="message"></p>
      </div>

      <div class="panel">
        <h2>Add Category</h2>
        <form id="categoryForm" class="grid-form">
          <label>
            Name
            <input id="categoryName" required />
          </label>
          <label>
            Type
            <select id="categoryType">
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </label>
          <button type="submit">Create category</button>
        </form>
        <p id="categoryMessage" class="message"></p>
      </div>
    </section>

    <section class="panel">
      <h2>Transactions</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Type</th>
              <th>Wallet</th>
              <th>Category</th>
              <th>Amount</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody id="txBody"></tbody>
        </table>
      </div>
    </section>

    <section class="split">
      <div class="panel">
        <h2>Statistics by Wallet</h2>
        <ul id="walletStats" class="stats-list"></ul>
      </div>
      <div class="panel">
        <h2>Statistics by Category</h2>
        <ul id="categoryStats" class="stats-list"></ul>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
